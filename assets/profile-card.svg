<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Abdul Muhaymin Nawaz GitHub profile card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .f { opacity:0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    .card { opacity:0; animation: in .9s ease-out forwards; }
    @keyframes in { to { opacity:1; } }
    .ring { stroke-dasharray:1194; stroke-dashoffset:1194; animation: draw 2.2s ease-out .5s forwards; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    .arcs { opacity:0; animation: in 1s ease-out 2.2s forwards; }
    .rule { stroke-dasharray:1120; stroke-dashoffset:1120; animation: draw 1.2s ease-out 1.6s forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    text { font-family: 'Courier New', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#10162b" stroke-width="1"/></pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.9" fill="#e23b4e"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#16294a" stop-opacity="0.55"/><stop offset="100%" stop-color="#080b16" stop-opacity="0"/></radialGradient>
    <clipPath id="emblem"><path d="M900 120 C858 165 805 205 800 275 C796 340 842 388 900 410 C958 388 1004 340 1000 275 C995 205 942 165 900 120 Z"/></clipPath>
