    <clipPath id="type"><rect x="36" y="160" width="0" height="70"><animate attributeName="width" from="0" to="560" begin="0.9s" dur="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="card"><rect width="1200" height="520" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
